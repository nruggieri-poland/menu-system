<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Poland Schools Menu Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  /* ── Reset & base ─────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy:      #07194a;
    --navy-mid:  #0d2870;
    --navy-card: #0f2f82;
    --accent:    #7cd0ff;
    --white:     #ffffff;
    --off-white: #d6e4ff;
    --gray:      #7a9cc6;
    --red:       #e84141;

    --col: 5;
    --gap: 14px;
    --radius: 22px;
    --header-h: 150px;
  }

  html, body {
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: var(--navy);
    font-family: 'DM Sans', sans-serif;
    color: var(--white);
  }

  /* ── Noise texture overlay ────────────────────────────────────────── */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 0; opacity: 0.6;
  }

  /* ── Floating food emojis (background) ───────────────────────────── */
  #floaters {
    position: fixed; inset: 0; pointer-events: none; z-index: 1;
    overflow: hidden;
  }
  .floater {
    position: absolute;
    font-size: 2.4rem;
    opacity: 0;
    animation: float linear infinite;
    user-select: none;
  }
  @keyframes float {
    0%   { transform: translateY(100vh) rotate(0deg);   opacity: 0; }
    8%   { opacity: 0.38; }
    92%  { opacity: 0.38; }
    100% { transform: translateY(-120px) rotate(360deg); opacity: 0; }
  }

  /* ── Main layout wrapper ──────────────────────────────────────────── */
  #app {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    width: 1920px; height: 1080px;
    padding: 24px 30px 20px;
    gap: 16px;
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: var(--header-h);
    background: linear-gradient(135deg, var(--navy-mid) 0%, #142f8a 100%);
    border-radius: var(--radius);
    padding: 0 40px;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 4px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
    animation: headerIn 0.7s cubic-bezier(.16,1,.3,1) both;
    animation-delay: 0.1s;
  }

  @keyframes headerIn {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: none; }
  }

  /* Accent stripe */
  #header::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 6px;
    background: var(--accent);
    border-radius: var(--radius) 0 0 var(--radius);
  }

  #header-left { display: flex; flex-direction: column; gap: 4px; }

  #meal-type-row { display: flex; align-items: center; gap: 20px; }

  #meal-icon {
    font-size: 84px;
    line-height: 1;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
    animation: iconBob 3s ease-in-out infinite;
  }
  @keyframes iconBob {
    0%, 100% { transform: rotate(-4deg) translateY(0); }
    50%      { transform: rotate(4deg) translateY(-4px); }
  }

  #meal-type {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 88px;
    line-height: 1;
    letter-spacing: 3px;
    color: var(--white);
    text-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }

  #school-name {
    font-size: 34px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 1px;
  }

  #header-center {
    display: flex; flex-direction: column;
    align-items: center; gap: 6px;
  }

  #week-label {
    font-size: 24px;
    font-weight: 600;
    color: var(--off-white);
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0.75;
  }

  #week-dates {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 76px;
    letter-spacing: 3px;
    color: var(--white);
  }

  #header-right {
    display: flex; flex-direction: column;
    align-items: flex-end; gap: 8px;
  }

  #clock {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    letter-spacing: 3px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(124,208,255,0.4);
  }

  #date-display {
    font-size: 26px; font-weight: 500;
    color: var(--off-white); opacity: 0.75;
  }

  /* ── Day columns grid ─────────────────────────────────────────────── */
  #grid {
    display: grid;
    grid-template-columns: repeat(var(--col), 1fr);
    gap: var(--gap);
    flex: 1;
    min-height: 0;
  }

  /* ── Single day card ──────────────────────────────────────────────── */
  .day-card {
    background: linear-gradient(160deg, #0f2f82 0%, #091e5a 100%);
    border-radius: var(--radius);
    border: 1px solid rgba(255,255,255,0.09);
    box-shadow: 0 4px 24px rgba(0,0,0,0.35);
    display: flex; flex-direction: column;
    overflow: hidden;
    animation: cardIn 0.6s cubic-bezier(.16,1,.3,1) both;
    transition: transform 0.2s;
  }
  .day-card:nth-child(1) { animation-delay: 0.05s; }
  .day-card:nth-child(2) { animation-delay: 0.12s; }
  .day-card:nth-child(3) { animation-delay: 0.19s; }
  .day-card:nth-child(4) { animation-delay: 0.26s; }
  .day-card:nth-child(5) { animation-delay: 0.33s; }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  .day-card.today {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent), 0 8px 32px rgba(124,208,255,0.25);
  }

  /* Day header bar */
  .day-header {
    padding: 16px 20px 14px;
    background: rgba(255,255,255,0.06);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: baseline; justify-content: space-between;
    flex-shrink: 0;
  }

  .day-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 50px;
    letter-spacing: 1px;
    color: var(--white);
  }

  .day-card.today .day-name { color: var(--accent); }

  .day-date {
    font-size: 38px; font-weight: 600;
    color: var(--gray);
  }

  .today-badge {
    display: none;
    align-items: center; gap: 5px;
    font-size: 24px; font-weight: 700;
    letter-spacing: 1px;
    color: var(--navy);
    background: var(--accent);
    padding: 4px 14px;
    border-radius: 20px;
    text-transform: uppercase;
    animation: badgeWiggle 1.6s ease-in-out infinite;
  }
  .day-card.today .today-badge { display: flex; }
  .day-card.today .day-date    { display: none; }

  @keyframes badgeWiggle {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50%      { transform: rotate(3deg) scale(1.06); }
  }

  /* Items list */
  .day-items {
    padding: 16px 20px;
    display: flex; flex-direction: column; gap: 34px;
    flex: 1; overflow: hidden;
  }

  .menu-item {
    display: flex; align-items: center; gap: 14px;
    animation: itemIn 0.4s ease both;
  }
  @keyframes itemIn {
    from { opacity: 0; transform: translateX(-8px); }
    to   { opacity: 1; transform: none; }
  }

  .item-dot {
    font-size: 32px;
    line-height: 1;
    flex-shrink: 0;
    filter: drop-shadow(0 2px 6px rgba(0,0,0,0.3));
  }

  .item-text {
    font-size: 42px;
    font-weight: 500;
    line-height: 1.3;
    color: var(--white);
  }

  .day-card.today .item-text { color: var(--white); }

  .no-menu {
    font-size: 40px;
    color: var(--gray);
    font-style: italic;
    opacity: 0.6;
    margin-top: 8px;
  }

  /* ── Ticker bar ───────────────────────────────────────────────────── */
  #ticker-wrap {
    height: 38px;
    background: rgba(255,255,255,0.05);
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.07);
    overflow: hidden;
    display: flex; align-items: center;
    flex-shrink: 0;
  }

  #ticker-label {
    background: var(--accent);
    color: var(--navy);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 0 16px;
    height: 100%;
    display: flex; align-items: center;
    flex-shrink: 0;
  }

  #ticker-track {
    flex: 1; overflow: hidden; position: relative;
  }

  #ticker-inner {
    display: inline-flex; gap: 60px;
    white-space: nowrap;
    font-size: 18px;
    color: var(--off-white);
    opacity: 0.8;
    padding-left: 30px;
    will-change: transform;
  }

  /* ── Error state ──────────────────────────────────────────────────── */
  #error-msg {
    display: none;
    position: fixed; inset: 0; z-index: 99;
    background: var(--navy);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--red);
    letter-spacing: 3px;
  }
  #error-msg p { font-family: 'DM Sans'; font-size: 22px; color: var(--gray); }

  /* ── Loading state ────────────────────────────────────────────────── */
  #loading {
    position: fixed; inset: 0; z-index: 100;
    background: var(--navy);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 20px;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.5,0,.75,0);
  }
  #loading.exit {
    opacity: 0;
    transform: scale(1.15);
    pointer-events: none;
  }
  #loading .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    letter-spacing: 6px;
    color: var(--white);
    animation: logoPulse 1.4s ease-in-out infinite;
  }
  #loading .logo span { color: var(--accent); }
  @keyframes logoPulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(255,255,255,0.1);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Intro moment: meal title + raining emojis, plays once before the
     menu is revealed ──────────────────────────────────────────────────── */
  #intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(circle at 50% 38%, var(--navy-mid) 0%, var(--navy) 72%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease, transform 0.6s cubic-bezier(.5,0,.75,0);
  }
  #intro.show { opacity: 1; pointer-events: auto; }
  #intro.exit { opacity: 0; transform: scale(1.15); }

  #intro-rain {
    position: absolute; inset: 0; z-index: 0;
    overflow: hidden; pointer-events: none;
  }
  .rain-emoji {
    position: absolute;
    top: -100px;
    opacity: 0;
    animation: rainFall linear infinite;
    user-select: none;
  }
  @keyframes rainFall {
    0%   { transform: translateY(0) rotate(0deg);      opacity: 0; }
    6%   { opacity: 0.85; }
    92%  { opacity: 0.85; }
    100% { transform: translateY(1220px) rotate(340deg); opacity: 0; }
  }

  #intro-content {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
  }

  #intro-icon {
    font-size: 170px;
    line-height: 1;
    filter: drop-shadow(0 6px 24px rgba(0,0,0,0.4));
    animation: introIconPop 0.7s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes introIconPop {
    0%   { opacity: 0; transform: scale(0.4) rotate(-10deg); }
    70%  { opacity: 1; transform: scale(1.12) rotate(4deg); }
    100% { opacity: 1; transform: scale(1) rotate(0deg); }
  }

  #intro-title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 230px;
    line-height: 1;
    letter-spacing: 10px;
    color: var(--white);
    text-shadow: 0 0 60px rgba(124,208,255,0.45), 0 4px 30px rgba(0,0,0,0.5);
    animation: introTitlePop 0.7s cubic-bezier(.16,1,.3,1) both;
    animation-delay: 0.12s;
  }
  @keyframes introTitlePop {
    0%   { opacity: 0; transform: scale(0.7) translateY(24px); }
    70%  { opacity: 1; transform: scale(1.04); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
  }

  #intro-sub {
    font-size: 30px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--accent);
    opacity: 0;
    animation: introFadeUp 0.6s ease both;
    animation-delay: 0.4s;
  }
  @keyframes introFadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 0.9; transform: none; }
  }

  /* ── Kid-friendly welcome burst, plays once when loading finishes ──── */
  #welcome-burst {
    position: fixed; inset: 0; z-index: 98;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
  }
  #welcome-burst span {
    position: absolute;
    font-size: 3.5rem;
    opacity: 0;
    animation: burst 0.9s cubic-bezier(.16,1,.3,1) both;
  }
  @keyframes burst {
    0%   { opacity: 0; transform: translate(0,0) scale(0.3); }
    30%  { opacity: 1; }
    100% { opacity: 0; transform: var(--burst-end) scale(1.1); }
  }
</style>
</head>
<body>

<!-- Loading overlay -->
<div id="loading">
  <div class="logo">Poland <span>Schools</span></div>
  <div class="spinner"></div>
</div>

<!-- Intro moment: meal title + raining emojis, plays once before the menu shows -->
<div id="intro">
  <div id="intro-rain"></div>
  <div id="intro-content">
    <div id="intro-icon" aria-hidden="true">🍽️</div>
    <div id="intro-title">—</div>
    <div id="intro-sub">—</div>
  </div>
</div>

<!-- Error overlay -->
<div id="error-msg">
  <div>⚠ Menu Unavailable</div>
  <p id="error-detail">Could not load menu data.</p>
</div>

<!-- One-time kid-friendly welcome burst, plays as the intro overlay exits -->
<div id="welcome-burst"></div>

<!-- Floating food emojis -->
<div id="floaters"></div>

<!-- Main app -->
<div id="app">
  <div id="header">
    <div id="header-left">
      <div id="meal-type-row">
        <div id="meal-icon" aria-hidden="true">🍽️</div>
        <div>
          <div id="meal-type">—</div>
          <div id="school-name">—</div>
        </div>
      </div>
    </div>
    <div id="header-center">
      <div id="week-label">Week of</div>
      <div id="week-dates">—</div>
    </div>
    <div id="header-right">
      <div id="clock">00:00</div>
      <div id="date-display">—</div>
    </div>
  </div>

  <div id="grid"></div>

  <div id="ticker-wrap">
    <div id="ticker-label">📋 Menu Note</div>
    <div id="ticker-track">
      <div id="ticker-inner"></div>
    </div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────

const FOOD_EMOJIS = ['🍕','🥞','🍎','🥐','🧀','🥛','🍊','🥨','🍌','🥯',
                     '🍇','🥗','🍱','🧁','🍓','🥕','🌽','🍒','🥦','🍋'];

const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday'];

const TICKER_MSGS = [
  "Menus subject to change without notice",
  "Students must choose at least 3 to 5 meal components",
  "Choice of meat or meat alternate  •  Choice of vegetable  •  Choice of fruit  •  Choice of grain/bread  •  Choice of milk",
  "USDA is an equal opportunity provider, employer, and lender",
  "Poland Local School District  •  Food Service Department",
];

// ── Helpers ───────────────────────────────────────────────────────────────

const qs = (s) => document.querySelector(s);

function getParams() {
  const p = new URLSearchParams(window.location.search);
  return {
    school:   p.get('school')   || 'pshs',
    type:     p.get('type')     || 'breakfast',
  };
}

function getMonday(d) {
  const day = new Date(d);
  const diff = (day.getDay() + 6) % 7;
  day.setDate(day.getDate() - diff);
  day.setHours(0,0,0,0);
  return day;
}

function fmtDate(d) {
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function fmtDateFull(d) {
  return d.toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// ── Floaters ──────────────────────────────────────────────────────────────

function spawnFloaters() {
  const wrap = qs('#floaters');
  for (let i = 0; i < 26; i++) {
    const el = document.createElement('div');
    el.className = 'floater';
    el.textContent = FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (18 + Math.random() * 22) + 's';
    el.style.animationDelay   = -(Math.random() * 30) + 's';
    el.style.fontSize = (2.2 + Math.random() * 2.6) + 'rem';
    wrap.appendChild(el);
  }
}

// ── Clock ─────────────────────────────────────────────────────────────────

function startClock() {
  function tick() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2,'0');
    const m = String(now.getMinutes()).padStart(2,'0');
    qs('#clock').textContent = `${h}:${m}`;
    qs('#date-display').textContent = fmtDateFull(now);
  }
  tick();
  setInterval(tick, 1000);
}

// ── Ticker ────────────────────────────────────────────────────────────────
//
// Driven by requestAnimationFrame against elapsed real time (not a fixed
// CSS @keyframes loop) — position is always recomputed fresh from how much
// time has actually passed, so it can't drift or freeze the way a CSS
// animation can on weaker TV hardware after running for hours. Even if
// frames get dropped while the tab is backgrounded, the very next frame
// jumps straight to the correct position instead of staying stuck.

let tickerRAF = null;

function buildTicker(items) {
  const msgs = [...TICKER_MSGS, ...items.slice(0,8).map(i => `Today's menu includes: ${i}`)];
  const single = msgs.join('   •   ');
  const track = qs('#ticker-inner');
  track.textContent = single + '   •   ' + single; // doubled for a seamless loop

  const PIXELS_PER_SEC = 55;
  const startTime = performance.now();
  let singleWidth = track.scrollWidth / 2;

  const onResize = () => { singleWidth = track.scrollWidth / 2; };
  window.addEventListener('resize', onResize);

  if (tickerRAF) cancelAnimationFrame(tickerRAF);
  function frame(now) {
    if (singleWidth > 0) {
      const elapsed = (now - startTime) / 1000;
      const offset = (elapsed * PIXELS_PER_SEC) % singleWidth;
      track.style.transform = `translateX(${-offset}px)`;
    }
    tickerRAF = requestAnimationFrame(frame);
  }
  tickerRAF = requestAnimationFrame(frame);
}

// ── Data loading ──────────────────────────────────────────────────────────

async function loadData(school, type) {
  const filename = `${type}-${school}.json`;
  const url = `https://raw.githubusercontent.com/nruggieri-poland/menus/refs/heads/master/data/${filename}`;
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);
  return resp.json();
}

function buildItemMap(data) {
  const map = {};
  for (const day of data.days || []) {
    map[day.date] = day.items;
  }
  return map;
}

// ── Render ────────────────────────────────────────────────────────────────

function renderWeek(itemMap, monday, schoolDisplay, type) {
  const todayKey = dateKey(new Date());

  // Header
  const friday = new Date(monday);
  friday.setDate(friday.getDate() + 4);
  qs('#meal-icon').textContent = MEAL_ICONS[type] || '🍽️';
  qs('#meal-type').textContent = type.charAt(0).toUpperCase() + type.slice(1);
  qs('#school-name').textContent = schoolDisplay;
  qs('#week-dates').textContent  = `${fmtDate(monday)} – ${fmtDate(friday)}`;

  // Grid
  const grid = qs('#grid');
  grid.innerHTML = '';

  let allItems = [];

  DAYS.forEach((dayName, i) => {
    const d = new Date(monday);
    d.setDate(d.getDate() + i);
    const key = dateKey(d);
    const items = itemMap[key] || [];
    allItems = allItems.concat(items);

    const isToday = key === todayKey;

    const card = document.createElement('div');
    card.className = 'day-card' + (isToday ? ' today' : '');

    const header = document.createElement('div');
    header.className = 'day-header';
    header.innerHTML = `
      <span class="day-name">${dayName}</span>
      <span class="day-date">${fmtDate(d)}</span>
      <span class="today-badge">⭐ Today</span>
    `;
    card.appendChild(header);

    const itemsEl = document.createElement('div');
    itemsEl.className = 'day-items';

    if (items.length === 0) {
      itemsEl.innerHTML = '<div class="no-menu">No menu available</div>';
    } else {
      items.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'menu-item';
        row.style.animationDelay = (0.08 * idx) + 's';
        const bullet = FOOD_EMOJIS[idx % FOOD_EMOJIS.length];
        row.innerHTML = `<div class="item-dot" aria-hidden="true">${bullet}</div><div class="item-text">${item}</div>`;
        itemsEl.appendChild(row);
      });
    }

    card.appendChild(itemsEl);
    grid.appendChild(card);
  });

  buildTicker(allItems);
}

// ── School display names ──────────────────────────────────────────────────

const SCHOOL_NAMES = {
  'pshs':            'Poland Seminary High School',
  'mckinley-middle': 'McKinley/Middle School',
};

const MEAL_ICONS = { breakfast: '🥞', lunch: '🍕' };

// ── Kid-friendly welcome burst ──────────────────────────────────────────────
// A one-time handful of big emojis flying outward from center as the
// intro overlay dismisses — plays once per page load (i.e. once per TV
// refresh cycle), not on every row/render.

function spawnWelcomeBurst(type) {
  const host = qs('#welcome-burst');
  const emojis = [MEAL_ICONS[type] || '🍽️', ...FOOD_EMOJIS.slice(0, 7)];
  emojis.forEach((emoji, i) => {
    const el = document.createElement('span');
    el.textContent = emoji;
    const angle = (i / emojis.length) * Math.PI * 2;
    const dist = 260 + Math.random() * 160;
    el.style.setProperty('--burst-end', `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px)`);
    el.style.animationDelay = (i * 0.03) + 's';
    host.appendChild(el);
  });
  setTimeout(() => { host.innerHTML = ''; }, 1200);
}

function dismissLoading() {
  qs('#loading').style.display = 'none';
}

// ── Intro moment ─────────────────────────────────────────────────────────
// A 3.5s title card (meal type, big) with food emojis raining in the
// background, shown once per page load right before the menu is revealed.

const INTRO_DURATION_MS = 3500;

function spawnIntroRain() {
  const wrap = qs('#intro-rain');
  wrap.innerHTML = '';
  for (let i = 0; i < 45; i++) {
    const el = document.createElement('div');
    el.className = 'rain-emoji';
    el.textContent = FOOD_EMOJIS[Math.floor(Math.random() * FOOD_EMOJIS.length)];
    el.style.left = Math.random() * 100 + 'vw';
    el.style.fontSize = (2.2 + Math.random() * 2.6) + 'rem';
    el.style.animationDuration = (2 + Math.random() * 2.4) + 's';
    el.style.animationDelay = -(Math.random() * 4.4) + 's';
    wrap.appendChild(el);
  }
}

function showIntro(type, schoolDisplay) {
  return new Promise((resolve) => {
    qs('#intro-icon').textContent = MEAL_ICONS[type] || '🍽️';
    qs('#intro-title').textContent = type.charAt(0).toUpperCase() + type.slice(1);
    qs('#intro-sub').textContent = schoolDisplay;
    spawnIntroRain();

    const intro = qs('#intro');
    requestAnimationFrame(() => intro.classList.add('show'));

    setTimeout(() => {
      intro.classList.add('exit');
      spawnWelcomeBurst(type);
      setTimeout(() => {
        intro.style.display = 'none';
        resolve();
      }, 600);
    }, INTRO_DURATION_MS);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────

async function boot() {
  spawnFloaters();
  startClock();

  const { school, type } = getParams();
  const schoolDisplay = SCHOOL_NAMES[school] || school;

  const today    = new Date();
  const monday   = getMonday(today);

  let itemMap = {};
  try {
    const data = await loadData(school, type);
    itemMap = buildItemMap(data);
  } catch(e) {
    console.warn('Menu data load failed:', e);
  }

  if (Object.keys(itemMap).length === 0) {
    qs('#loading').style.display    = 'none';
    qs('#error-msg').style.display  = 'flex';
    qs('#error-detail').textContent = `No data found for ${school} / ${type}`;
    return;
  }

  dismissLoading();
  await showIntro(type, schoolDisplay);

  renderWeek(itemMap, monday, schoolDisplay, type);

  // Auto-refresh at midnight to flip to next week
  const msUntilMidnight = new Date().setHours(24,0,5,0) - Date.now();
  setTimeout(() => location.reload(), msUntilMidnight);
}

boot().catch(err => {
  console.error(err);
  qs('#loading').style.display   = 'none';
  qs('#error-msg').style.display = 'flex';
  qs('#error-detail').textContent = err.message;
});
</script>
