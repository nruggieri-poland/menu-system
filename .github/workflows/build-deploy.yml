name: Build and Deploy Menus

on:
  schedule:
    # Daily at 6:00 AM Eastern (11:00 UTC).
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      year:
        description: "Single year (YYYY) — leave blank for rolling window"
        required: false
      month:
        description: "Single month (1-12) — leave blank for rolling window"
        required: false
      back:
        description: "Months to look back (default 1)"
        required: false
        default: "1"
      ahead:
        description: "Months to look ahead (default 1)"
        required: false
        default: "1"
  push:
    branches: ["master"]
    paths:
      - "scripts/**"
      - "site/embed/menu-widget.js"
      - ".github/workflows/build-deploy.yml"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install poppler (PDF -> image rendering for thumbnails)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch menus
        run: |
          cd scripts
          YEAR="${{ github.event.inputs.year }}"
          MONTH="${{ github.event.inputs.month }}"
          BACK="${{ github.event.inputs.back || '1' }}"
          AHEAD="${{ github.event.inputs.ahead || '1' }}"

          if [ -n "$YEAR" ] && [ -n "$MONTH" ]; then
            echo "Single-month mode: $YEAR-$MONTH"
            python fetch_menus.py --year "$YEAR" --month "$MONTH"
          else
            echo "Rolling window mode: $BACK months back, $AHEAD months ahead"
            python fetch_menus.py --back "$BACK" --ahead "$AHEAD"
          fi

      - name: Generate PDF calendars
        run: |
          cd scripts
          python generate_pdf.py

      - name: Generate PDF preview thumbnails
        run: |
          cd scripts
          python generate_thumbnails.py

      - name: Build site (accessible pages, calendars, embed guide, Finalsite embeds)
        run: |
          cd scripts
          python build_site.py
          python build_pages.py
          python build_finalsite_embeds.py

      - name: Commit updated menu data
        # Only data/ is committed — 4 small rollup files, cheap to keep in git
        # history and gives simple, reliable persistence between runs. site/
        # is pure build output (fully regenerated every run from data/ plus
        # the scripts) and is deployed straight to Pages below — it's never
        # committed, so it never bloats git history.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: update menu data $(date +%Y-%m-%d)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site/"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
