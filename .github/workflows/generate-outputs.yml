name: Generate Outputs & Deploy

on:
  # Trigger automatically after fetch-menus succeeds
  workflow_run:
    workflows: ["Fetch Menus"]
    types: [completed]
  # Also allow manual runs
  workflow_dispatch:
    inputs:
      year:
        description: "Year (YYYY) — leave blank for current"
        required: false
      month:
        description: "Month (1-12) — leave blank for current"
        required: false

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Pull latest (includes data/ committed by fetch-menus)
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python deps
        run: pip install reportlab requests

      - name: Determine year/month
        id: date
        run: |
          YEAR="${{ github.event.inputs.year }}"
          MONTH="${{ github.event.inputs.month }}"
          if [ -z "$YEAR" ]; then YEAR=$(date +%Y); fi
          if [ -z "$MONTH" ]; then MONTH=$(date +%-m); fi
          echo "year=$YEAR"  >> $GITHUB_OUTPUT
          echo "month=$MONTH" >> $GITHUB_OUTPUT

      - name: Generate PDFs
        run: |
          cd scripts
          python - <<'PYEOF'
          import sys, os
          sys.path.insert(0, ".")
          from generate_pdf import generate_all
          python generate_pdf.py
          PYEOF
        env:
          YEAR:  ${{ steps.date.outputs.year }}
          MONTH: ${{ steps.date.outputs.month }}

      - name: Build static site
        run: python scripts/build_site.py

      - name: Commit PDFs
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pdfs/
          git diff --cached --quiet || git commit -m "chore: regenerate PDFs $(date +%Y-%m-%d)"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: false
