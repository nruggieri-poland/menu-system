<!-- Poland Schools menu widget — Poland Seminary High School Breakfast
     Paste this entire block into the Finalsite Custom HTML component for
     this page. No external script/library dependencies, no HTML markup
     needed (the script creates its own container). All CSS/JS in this file
     is namespaced to this specific feed, so it's safe to paste alongside
     any of the other three widget files on the same page. The MENU DATA is
     never hardcoded — the only network request this makes is to fetch the
     current menu JSON from the repo, so it always shows live data.
     Source: scripts/build_finalsite_embeds.py (do not hand-edit; regenerate
     instead if assets/embed/menu-widget.js changes). -->
<script>
(function () {
  'use strict';

  var REPO_DATA_BASE = 'https://raw.githubusercontent.com/nruggieri-poland/menus/refs/heads/master/data/';

  var DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
  var MONTH_NAMES = ['', 'January', 'February', 'March', 'April', 'May', 'June',
    'July', 'August', 'September', 'October', 'November', 'December'];
  var SCHOOL_NAMES = {
    'pshs': 'Poland Seminary High School',
    'mckinley-middle': 'McKinley/Middle School'
  };

  // ── Helpers ────────────────────────────────────────────────────────────

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function dateKey(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function sameDay(a, b) { return dateKey(a) === dateKey(b); }

  function addDays(d, n) { var r = new Date(d); r.setDate(r.getDate() + n); return r; }

  function getMonday(d) {
    var day = new Date(d);
    var diff = (day.getDay() + 6) % 7;
    day.setDate(day.getDate() - diff);
    day.setHours(0, 0, 0, 0);
    return day;
  }

  function fmtDate(d) {
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function fmtDateFull(d) {
    return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  function fmtDateLong(d) {
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }

  // ── Data fetch: one rollup file per feed, shared across all widget
  // instances on the page and cached for the page's lifetime ──────────────

  var rollupCache = {};

  function fetchRollup(school, menutype) {
    var key = school + '/' + menutype;
    if (rollupCache[key]) return rollupCache[key];
    var filename = menutype + '-' + school + '.json';
    rollupCache[key] = fetch(REPO_DATA_BASE + filename)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (data) {
        var itemMap = {};
        (data.days || []).forEach(function (d) { itemMap[d.date] = d.items; });
        return itemMap;
      })
      .catch(function () { return null; });
    return rollupCache[key];
  }

  // ── Stylesheet (injected once, scoped under .psmenu-pshs-breakfast) ─────────────────────

  var CSS = ''
    + '.psmenu-pshs-breakfast{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#1a1a2e;background:#fff;line-height:1.5;}'
    + '.psmenu-pshs-breakfast *,.psmenu-pshs-breakfast *::before,.psmenu-pshs-breakfast *::after{box-sizing:border-box;}'
    + '.psmenu-pshs-breakfast a{color:#0d2870;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem 1rem;padding-bottom:.75rem;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-announce{color:#1a3e9c;font-size:1.5rem;font-weight:700;margin:0;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-announce:focus-visible{outline:3px solid #0b57d0;outline-offset:4px;border-radius:2px;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-nav{display:flex;justify-content:flex-end;gap:.5rem;flex-shrink:0;align-items:center;flex-wrap:wrap;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-nav button{background:#2d3748;color:#fff;border:0;border-radius:8px;padding:.55rem .95rem;font-size:.85rem;font-weight:600;cursor:pointer;min-height:44px;min-width:44px;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-nav button:hover{background:#1c2536;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-nav button:disabled{opacity:.4;cursor:default;}'
    + '.psmenu-pshs-breakfast button:focus-visible{outline:3px solid #0b57d0;outline-offset:2px;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-print{background:none !important;color:#0d2870 !important;text-decoration:underline;font-weight:400 !important;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-daylist{border:1px solid #d8dee9;border-radius:10px;overflow:hidden;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-day + .psmenu-pshs-breakfast-day{border-top:1px solid #d8dee9;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-day-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:.35rem .75rem;background:#eef0f2;padding:.7rem 1.25rem;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-day.today .psmenu-pshs-breakfast-day-head{background:#dce6fb;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-day-head h3{font-size:1.05rem;color:#1a3e9c;margin:0;display:inline-flex;align-items:center;gap:.5rem;font-weight:700;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-day-head .psmenu-pshs-breakfast-date{font-weight:700;color:#1a3e9c;font-size:1rem;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-flag{font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#0d2870;background:#cfe0fb;padding:.15rem .5rem;border-radius:999px;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-day-body{padding:1rem 1.25rem 1.25rem;background:#fff;}'
    + '.psmenu-pshs-breakfast ul.psmenu-pshs-breakfast-items{list-style:none;margin:0;padding:0;}'
    + '.psmenu-pshs-breakfast ul.psmenu-pshs-breakfast-items li{padding-left:1.1rem;position:relative;margin-bottom:.4rem;color:#333;}'
    + '.psmenu-pshs-breakfast ul.psmenu-pshs-breakfast-items li:first-child::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:#1a3e9c;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-toggle{display:flex;justify-content:center;margin-top:1.25rem;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-toggle button{background:#1a3e9c;color:#fff;border:0;padding:.65rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;min-height:44px;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-toggle button:hover{background:#0d2870;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal{border-collapse:collapse;width:100%;margin-top:.5rem;table-layout:fixed;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal caption{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal th,.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td{border:1px solid #d8dee9;vertical-align:top;padding:.5rem;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal thead th{background:#1a3e9c;color:#fff;text-align:center;padding:.6rem;font-size:.9rem;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td{width:20%;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td.psmenu-pshs-breakfast-empty{background:#f2f4f8;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-daynum{font-weight:700;color:#1a3e9c;display:block;text-align:right;margin-bottom:.3rem;font-size:.85rem;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal ul{list-style:none;margin:0;padding:0;font-size:.8rem;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal ul li{margin-bottom:.25rem;color:#333;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-status{padding:2rem 1rem;text-align:center;color:#475569;}'
    + '@media (max-width:700px){'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal thead{position:absolute;left:-9999px;top:-9999px;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal,.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal tbody,.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal tr,.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td{display:block;width:100%;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal tr{margin-bottom:1rem;border:1px solid #d8dee9;border-radius:8px;overflow:hidden;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td{border:none;border-bottom:1px solid #d8dee9;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td:last-child{border-bottom:none;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td.psmenu-pshs-breakfast-empty{display:none;}'
    + '.psmenu-pshs-breakfast table.psmenu-pshs-breakfast-cal td::before{content:attr(data-day);font-weight:700;color:#1a3e9c;display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.3rem;}'
    + '.psmenu-pshs-breakfast .psmenu-pshs-breakfast-daynum{text-align:left;}'
    + '}'
    + '@media print{.psmenu-pshs-breakfast .psmenu-pshs-breakfast-nav,.psmenu-pshs-breakfast .psmenu-pshs-breakfast-toggle{display:none !important;}}';

  function injectStyleOnce() {
    if (document.getElementById('psmenu-pshs-breakfast-style')) return;
    var style = document.createElement('style');
    style.id = 'psmenu-pshs-breakfast-style';
    style.textContent = CSS;
    document.head.appendChild(style);
  }

  // ── Widget ────────────────────────────────────────────────────────────

  function Widget(el, config) {
    config = config || {};
    this.el = el;
    this.school = config.school || el.getAttribute('data-school');
    this.menutype = config.menutype || el.getAttribute('data-menutype');
    this.displayName = config.displayName || el.getAttribute('data-display-name')
      || SCHOOL_NAMES[this.school] || this.school;
    this.view = (config.view || el.getAttribute('data-view')) === 'week' ? 'week' : 'calendar';
    var today = new Date();
    this.year = today.getFullYear();
    this.month = today.getMonth() + 1;
    this.monday = getMonday(today);
  }

  Widget.prototype.init = function () {
    injectStyleOnce();
    this.el.classList.add('psmenu-pshs-breakfast');
    if (!this.school || !this.menutype) {
      this.el.innerHTML = '<p class="psmenu-pshs-breakfast-status">Menu embed is missing data-school / data-menutype.</p>';
      return;
    }
    // The visible label only ever shows the current month/week — no school
    // name or "Lunch"/"Breakfast" text, since the host page's own title
    // already covers that. Give the region an accessible name directly so
    // screen reader users tabbing in still get that context.
    this.el.setAttribute('role', 'region');
    this.el.setAttribute('aria-label', this.displayName + ' ' + cap(this.menutype) + ' menu');
    this.render(false);
  };

  Widget.prototype.getItemMap = function () {
    return fetchRollup(this.school, this.menutype);
  };

  // moveFocus is true only for user-initiated navigation (prev/next/today/
  // view toggle), never on the initial page-load render — moving focus on
  // load would be jarring and unexpected. A blanket aria-live region on this
  // whole container would work for announcing updates too, but every
  // navigation swaps in an entire month's worth of menu items, and a
  // "polite" live region would read all of that out loud on every click.
  // Moving focus to the heading instead announces just "September 2026" via
  // the normal focus-change announcement, which is what a sighted user
  // effectively "sees" happen too.
  Widget.prototype.render = function (moveFocus) {
    this.el.innerHTML = '<p class="psmenu-pshs-breakfast-status">Loading menu&hellip;</p>';
    if (this.view === 'calendar') this.renderCalendar(moveFocus);
    else this.renderWeek(moveFocus);
  };

  Widget.prototype.focusHeading = function () {
    var target = this.el.querySelector('.psmenu-pshs-breakfast-announce');
    if (target) target.focus();
  };

  // ── Month / calendar view ────────────────────────────────────────────

  Widget.prototype.renderCalendar = function (moveFocus) {
    var self = this;
    this.getItemMap().then(function (itemMap) {
      self.el.innerHTML = self.buildCalendarHTML(itemMap, self.year, self.month);
      self.bindCalendarNav();
      if (moveFocus) self.focusHeading();
    });
  };

  Widget.prototype.buildCalendarHTML = function (itemMap, year, month) {
    var fetchFailed = itemMap === null;
    itemMap = itemMap || {};

    var first = new Date(year, month - 1, 1);
    var numDays = daysInMonth(year, month);
    var weekStart = getMonday(first);

    var weeks = [];
    var cur = new Date(weekStart);
    var lastOfMonth = new Date(year, month - 1, numDays);
    while (cur <= lastOfMonth) {
      var week = [];
      for (var i = 0; i < 5; i++) {
        var d = addDays(cur, i);
        week.push(d.getMonth() === month - 1 ? d : null);
      }
      weeks.push(week);
      cur = addDays(cur, 7);
    }

    var headerCells = DAYS.map(function (d) { return '<th scope="col">' + d + '</th>'; }).join('');

    var rowsHtml = weeks.map(function (week) {
      var cells = week.map(function (d, i) {
        var dayName = DAYS[i];
        if (!d) return '<td class="psmenu-pshs-breakfast-empty" data-day="' + esc(dayName) + '"></td>';
        var key = dateKey(d);
        var items = itemMap[key] || [];
        var itemsHtml = items.length
          ? '<ul class="psmenu-pshs-breakfast-cal-items">' + items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>'
          : '';
        return '<td data-day="' + esc(dayName) + '">'
          + '<span class="psmenu-pshs-breakfast-sr-only">' + esc(fmtDateLong(d)) + ': </span>'
          + '<span class="psmenu-pshs-breakfast-daynum" aria-hidden="true">' + d.getDate() + '</span>'
          + itemsHtml + '</td>';
      }).join('');
      return '<tr>' + cells + '</tr>';
    }).join('');

    var monthLabel = MONTH_NAMES[month] + ' ' + year;
    var noDataNote = fetchFailed
      ? '<p class="psmenu-pshs-breakfast-status">Sorry, the menu couldn&rsquo;t be loaded right now. Please try again later.</p>'
      : '';

    return ''
      + '<div class="psmenu-pshs-breakfast-head">'
      + '<p class="psmenu-pshs-breakfast-announce" tabindex="-1">' + esc(monthLabel) + '</p>'
      + '<nav class="psmenu-pshs-breakfast-nav" aria-label="Month navigation">'
      + '<button type="button" data-nav="today">Today</button>'
      + '<button type="button" data-nav="prev" aria-label="Previous month">&larr;</button>'
      + '<button type="button" data-nav="next" aria-label="Next month">&rarr;</button>'
      + '<button type="button" data-nav="print" class="psmenu-pshs-breakfast-print">Print</button>'
      + '</nav></div>'
      + noDataNote
      + '<table class="psmenu-pshs-breakfast-cal"><caption>' + esc(cap(this.menutype)) + ' menu &mdash; ' + esc(this.displayName) + ' &mdash; ' + esc(monthLabel) + '</caption>'
      + '<thead><tr>' + headerCells + '</tr></thead><tbody>' + rowsHtml + '</tbody></table>'
      + '<div class="psmenu-pshs-breakfast-toggle"><button type="button" data-nav="list">List View</button></div>';
  };

  Widget.prototype.bindCalendarNav = function () {
    var self = this;
    bindNav(this.el, {
      prev: function () { self.shiftMonth(-1); },
      next: function () { self.shiftMonth(1); },
      today: function () { var t = new Date(); self.year = t.getFullYear(); self.month = t.getMonth() + 1; self.render(true); },
      print: function () { window.print(); },
      list: function () { self.view = 'week'; self.render(true); }
    });
  };

  Widget.prototype.shiftMonth = function (delta) {
    var m = this.month + delta, y = this.year;
    if (m < 1) { m = 12; y -= 1; }
    if (m > 12) { m = 1; y += 1; }
    this.year = y; this.month = m;
    this.render(true);
  };

  // ── Week / list view ──────────────────────────────────────────────────

  Widget.prototype.renderWeek = function (moveFocus) {
    var self = this;
    this.getItemMap().then(function (itemMap) {
      self.el.innerHTML = self.buildWeekHTML(itemMap, self.monday);
      self.bindWeekNav();
      if (moveFocus) self.focusHeading();
    });
  };

  Widget.prototype.buildWeekHTML = function (itemMap, monday) {
    var fetchFailed = itemMap === null;
    itemMap = itemMap || {};
    var today = new Date();
    var friday = addDays(monday, 4);

    var rows = DAYS.map(function (dayName, i) {
      var d = addDays(monday, i);
      var key = dateKey(d);
      var items = itemMap[key] || [];
      var isToday = sameDay(d, today);
      var flag = isToday ? '<span class="psmenu-pshs-breakfast-flag">Today</span>' : '';
      var itemsHtml = items.length
        ? '<ul class="psmenu-pshs-breakfast-items">' + items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>'
        : '';
      return '<div class="psmenu-pshs-breakfast-day' + (isToday ? ' today' : '') + '">'
        + '<div class="psmenu-pshs-breakfast-day-head"><h3>' + esc(dayName) + flag + '</h3>'
        + '<span class="psmenu-pshs-breakfast-date">' + esc(fmtDateFull(d)) + '</span></div>'
        + '<div class="psmenu-pshs-breakfast-day-body">' + itemsHtml + '</div></div>';
    }).join('');

    var noDataNote = fetchFailed
      ? '<p class="psmenu-pshs-breakfast-status">Sorry, the menu couldn&rsquo;t be loaded right now. Please try again later.</p>'
      : '';

    var weekLabel = fmtDate(monday) + ' – ' + fmtDate(friday) + ', ' + monday.getFullYear();

    return ''
      + '<div class="psmenu-pshs-breakfast-head">'
      + '<p class="psmenu-pshs-breakfast-announce" tabindex="-1">' + esc(weekLabel) + '</p>'
      + '<nav class="psmenu-pshs-breakfast-nav" aria-label="Week navigation">'
      + '<button type="button" data-nav="today">Today</button>'
      + '<button type="button" data-nav="prev" aria-label="Previous week">&larr;</button>'
      + '<button type="button" data-nav="next" aria-label="Next week">&rarr;</button>'
      + '<button type="button" data-nav="print" class="psmenu-pshs-breakfast-print">Print</button>'
      + '</nav></div>'
      + noDataNote
      + '<div class="psmenu-pshs-breakfast-daylist">' + rows + '</div>'
      + '<div class="psmenu-pshs-breakfast-toggle"><button type="button" data-nav="month">Month View</button></div>';
  };

  Widget.prototype.bindWeekNav = function () {
    var self = this;
    bindNav(this.el, {
      prev: function () { self.monday = addDays(self.monday, -7); self.render(true); },
      next: function () { self.monday = addDays(self.monday, 7); self.render(true); },
      today: function () { self.monday = getMonday(new Date()); self.render(true); },
      print: function () { window.print(); },
      month: function () { self.view = 'calendar'; self.render(true); }
    });
  };

  // ── Shared nav wiring ─────────────────────────────────────────────────

  function bindNav(root, handlers) {
    Object.keys(handlers).forEach(function (key) {
      var btn = root.querySelector('[data-nav="' + key + '"]');
      if (btn) btn.addEventListener('click', handlers[key]);
    });
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }


  var __script = document.currentScript;
  var __container = document.createElement('div');
  __script.parentNode.insertBefore(__container, __script.nextSibling);
  new Widget(__container, {
    school: "pshs",
    menutype: "breakfast",
    displayName: "Poland Seminary High School"
  }).init();
})();
</script>
